[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linxira-component-manager"
version = "0.1.0"
description = "Windows Features-style bundle and component selector for Linxira OS"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Linxira OS contributors"}]
dependencies = ["PySide6>=6.7"]

[project.scripts]
linxira-component-manager = "linxira_component_manager.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
